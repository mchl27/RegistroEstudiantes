<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/inscripcion" aria-label="Inicio">
      <span class="brand__mark">RE</span>
      <span class="brand__text">Registro <strong>Estudiantes</strong></span>
    </a>

    <nav class="nav" aria-label="Principal">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="nav__link--active" class="nav__link">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="user">
      <span class="avatar avatar--sm" aria-hidden="true">{{ initials() }}</span>
      <span class="user__name">{{ fullName() }}</span>
      <button type="button" class="btn btn--ghost btn--sm" (click)="logout()">Salir</button>
    </div>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="footer">
  Programa de créditos · 3 materias · 9 créditos · profesores distintos
</footer>
