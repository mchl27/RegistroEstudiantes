<div class="auth">
  <app-auth-hero />

  <section class="auth__panel">
    <div class="card auth__card">
      <h2>Crear cuenta</h2>
      <p class="muted">Regístrate para inscribir tus materias.</p>

      @if (error()) {
        <div class="alert alert--error" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-row">
          <label class="field">
            <span class="field__label">Nombre</span>
            <input formControlName="firstName" autocomplete="given-name" />
            @if (fieldError('firstName'); as message) {
              <span class="field__error">{{ message }}</span>
            }
          </label>
          <label class="field">
            <span class="field__label">Apellido</span>
            <input formControlName="lastName" autocomplete="family-name" />
            @if (fieldError('lastName'); as message) {
              <span class="field__error">{{ message }}</span>
            }
          </label>
        </div>

        <label class="field">
          <span class="field__label">Número de documento</span>
          <input formControlName="documentNumber" inputmode="numeric" />
          @if (fieldError('documentNumber'); as message) {
            <span class="field__error">{{ message }}</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Correo</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com" />
          @if (fieldError('email'); as message) {
            <span class="field__error">{{ message }}</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Contraseña</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
          @if (fieldError('password'); as message) {
            <span class="field__error">{{ message }}</span>
          } @else {
            <span class="field__hint">Mínimo 8 caracteres, con letras y números.</span>
          }
        </label>

        <button class="btn btn--primary btn--block" type="submit" [disabled]="loading()">
          {{ loading() ? 'Creando cuenta…' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="auth__switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </section>
</div>
